spring.application.name=agendamento-service

# -----------------------------
# DATASOURCE
# -----------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agendamento}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------
# JPA / HIBERNATE
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------
# FLYWAY
# -----------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -----------------------------
# SERVER CONFIG
# -----------------------------
server.address=0.0.0.0
server.port=${SERVER_PORT:8081}

# -----------------------------
# SWAGGER / OPENAPI
# -----------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.defaultModelsExpandDepth=-1

# -----------------------------
# JWT
# -----------------------------
agendify.security.jwt.secret=${JWT_SECRET:kec+6=$d5TE*bzrhB3-W,A]}X8t^U&GF}
agendify.security.jwt.expiration=${JWT_EXPIRATION:3600000}
agendify.security.jwt.refresh=${JWT_REFRESH:604800000}