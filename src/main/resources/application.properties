spring.application.name=${SPRING_APPLICATION_NAME:agendamento-service}

# -----------------------------
# DATASOURCE - SUPABASE / ENV
# -----------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.ybqrwxbapmhhrxgaliya.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:MecPoint@2026#Postgres!}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# -----------------------------
# JPA / HIBERNATE
# -----------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# -----------------------------
# FLYWAY
# -----------------------------
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

# -----------------------------
# SERVER CONFIG
# -----------------------------
server.address=0.0.0.0
server.port=${PORT:8081}

# -----------------------------
# SWAGGER / OPENAPI
# -----------------------------
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.operationsSorter=${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:method}
springdoc.swagger-ui.tagsSorter=${SPRINGDOC_SWAGGER_UI_TAGS_SORTER:alpha}
springdoc.swagger-ui.tryItOutEnabled=${SPRINGDOC_SWAGGER_UI_TRY_IT_OUT_ENABLED:true}
springdoc.swagger-ui.defaultModelsExpandDepth=${SPRINGDOC_SWAGGER_UI_DEFAULT_MODELS_EXPAND_DEPTH:-1}

# -----------------------------
# JWT
# -----------------------------
agendify.security.jwt.secret=${AGENDIFY_SECURITY_JWT_SECRET:kec+6=$d5TE*bzrhB3-W,A]}X8t^U&GF}
agendify.security.jwt.expiration=${AGENDIFY_SECURITY_JWT_EXPIRATION:3600000}
agendify.security.jwt.refresh=${AGENDIFY_SECURITY_JWT_REFRESH:604800000}